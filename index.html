<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbfolio</title>
<meta name="description" content="">
<link rel="stylesheet" href="assets/dbfolio.css">
</head>
<body>

<header class="db-header">
  <h1 id="db-title" class="db-title"></h1>
  <p id="db-description" class="db-description"></p>
</header>

<main id="db-gallery" class="db-gallery" aria-live="polite"></main>

<div id="db-unlock" class="db-unlock" hidden>
  <form id="db-unlock-form" class="db-unlock-form">
    <label for="db-password">This gallery is password protected</label>
    <input id="db-password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">View gallery</button>
    <p id="db-unlock-error" class="db-unlock-error" role="alert" hidden></p>
  </form>
</div>

<p id="db-status" class="db-status" role="status"></p>

<footer id="db-contact" class="db-contact" hidden></footer>

<div id="db-lightbox" class="db-lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="db-lightbox-info" class="db-lightbox-info" type="button" aria-label="Show photo details" aria-pressed="false">&#9432;</button>
  <button id="db-lightbox-close" class="db-lightbox-close" type="button" aria-label="Close">&times;</button>
  <button id="db-lightbox-prev" class="db-lightbox-nav db-lightbox-prev" type="button" aria-label="Previous photo">&#8249;</button>
  <img id="db-lightbox-image" class="db-lightbox-image" alt="">
  <button id="db-lightbox-next" class="db-lightbox-nav db-lightbox-next" type="button" aria-label="Next photo">&#8250;</button>
  <p id="db-lightbox-caption" class="db-lightbox-caption"></p>
  <dl id="db-lightbox-meta" class="db-lightbox-meta" hidden></dl>
</div>

<script type="module" src="assets/dbfolio.js"></script>
</body>
</html>
