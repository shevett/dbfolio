<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbfolio</title>
<meta name="description" content="">
<link rel="stylesheet" href="assets/dbfolio.css">
</head>
<body>

<header class="db-header">
  <h1 id="db-title" class="db-title"></h1>
  <p id="db-description" class="db-description"></p>
</header>

<main id="db-gallery" class="db-gallery" aria-live="polite"></main>

<div id="db-unlock" class="db-unlock" hidden>
  <form id="db-unlock-form" class="db-unlock-form">
    <label for="db-password">This gallery is password protected</label>
    <input id="db-password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">View gallery</button>
    <p id="db-unlock-error" class="db-unlock-error" role="alert" hidden></p>
  </form>
</div>

<p id="db-status" class="db-status" role="status"></p>

<footer id="db-contact" class="db-contact" hidden></footer>

<script type="module" src="assets/dbfolio.js"></script>
</body>
</html>
